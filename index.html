<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Linktree</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .overlay {
      min-height: 100vh;
      background: rgba(0,0,0,0.25);
      padding: 24px 16px 100px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .image-link {
      display: block;
      width: 74%;
      margin: 0 auto;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .image-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .image-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* scroll 버튼 */
    .scroll-indicator {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      backdrop-filter: blur(6px);
      animation: float 1.6s ease-in-out infinite;
      z-index: 1000;
    }

    @keyframes float {
      0% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
      100% { transform: translate(-50%, 0); }
    }

    /* minsim 플로팅 */
    #minsim-float {
      position: fixed;
      right: 6px;
      bottom: 20px;
      z-index: 999;
      pointer-events: none;
    }

    #minsim-float img {
      width: 180px;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="container" id="image-container">
      <!-- JS가 이미지 자동 삽입 -->
    </div>
  </div>

  <a href="#" class="scroll-indicator"
     onclick="window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' }); return false;">
    SCROLL
  </a>

  <div id="minsim-float">
    <img src="minsim1.png" alt="minsim" />
  </div>

  <script>
    const container = document.getElementById('image-container');

    // 이미지 슬롯 설정 (최대 20개)
    const images = [
      { file: 'image01.png', link: 'https://example.com/1' },
      { file: 'image02.png', link: 'https://example.com/2' },
      { file: 'image03.png', link: 'https://example.com/3' },
      { file: 'image04.png', link: 'https://example.com/4' },
      { file: 'image05.png', link: 'https://example.com/5' },
      { file: 'image06.png', link: 'https://example.com/6' },
      { file: 'image07.png', link: 'https://example.com/7' },
      { file: 'image08.png', link: 'https://example.com/8' },
      { file: 'image09.png', link: 'https://example.com/9' },
      { file: 'image10.png', link: 'https://example.com/10' },
      { file: 'image11.png', link: 'https://example.com/11' },
      { file: 'image12.png', link: 'https://example.com/12' },
      { file: 'image13.png', link: 'https://example.com/13' },
      { file: 'image14.png', link: 'https://example.com/14' },
      { file: 'image15.png', link: 'https://example.com/15' },
      { file: 'image16.png', link: 'https://example.com/16' },
      { file: 'image17.png', link: 'https://example.com/17' },
      { file: 'image18.png', link: 'https://example.com/18' },
      { file: 'image19.png', link: 'https://example.com/19' },
      { file: 'image20.png', link: 'https://example.com/20' }
    ];

    images.forEach(item => {
      const img = new Image();
      img.src = item.file;

      img.onload = () => {
        const a = document.createElement('a');
        a.href = item.link;
        a.target = '_blank';
        a.className = 'image-link';

        a.appendChild(img);
        container.appendChild(a);
      };

      // 실패하면 아무것도 안 함 (DOM 생성 X)
    });

    // minsim 스크롤 반응
    let lastScrollY = window.scrollY;
    const minsim = document.getElementById('minsim-float');

    window.addEventListener('scroll', () => {
      const current = window.scrollY;
      const delta = current - lastScrollY;
      minsim.style.transform = `translateY(${Math.max(Math.min(delta, 10), -10)}px)`;
      lastScrollY = current;
    });
  </script>
</body>
</html>
