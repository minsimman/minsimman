<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Linktree</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .overlay {
      min-height: 100vh;
      background: rgba(0,0,0,0.25);
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .image-link {
      display: block;
      /* 둥근 처리 제거 */
      border-radius: 0;
      overflow: visible;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin: 0 auto;
    }

    /* 전체적으로 기존 대비 약 20% 축소 */
    .img-0 { width: 95%; margin: 12px auto 8px; opacity: 0.95; }
    .img-1 { width: 74%; margin-top: 18px; }
    .img-2 { width: 74%; }
    .img-3 { width: 74%; }

    .image-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .image-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* scroll 버튼 */
    .scroll-indicator {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      backdrop-filter: blur(6px);
      animation: float 1.6s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
      100% { transform: translate(-50%, 0); }
    }

    /* 오른쪽 하단 따라다니는 minsim 이미지 */
    #minsim-float {
      position: fixed;
      right: 16px;
      bottom: 20px;
      z-index: 999;
      pointer-events: none;
      transition: transform 0.15s ease-out;
    }

    #minsim-float img {
      width: 180px;
      height: auto;
      display: block;
    }
      50% { transform: translate(-50%, -6px); }
      100% { transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">

      <!-- image 0 (상단 장식 / 안내용) -->
      <div class="image-link img-0">
        <img src="image00.png" alt="top image" />
      </div>

      <!-- 이미지 1 -->
      <a class="image-link img-1" href="https://petitions.assembly.go.kr/proceed/onGoingAll/3F82B3E5292B6B8BE064ECE7A7064E8B" target="_blank">
        <img src="image1.png" alt="link image 1" />
      </a>

      <!-- 이미지 2 -->
      <a class="image-link img-2" href="https://example.com/2" target="_blank">
        <img src="image2.png" alt="link image 2" />
      </a>

      <!-- 이미지 3 -->
      <a class="image-link img-3" href="https://example.com/3" target="_blank">
        <img src="image3.png" alt="link image 3" />
      </a>

    </div>
  </div>

  <!-- scroll 버튼 -->
  <a href="#" class="scroll-indicator" onclick="window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' }); return false;">
    SCROLL
  </a>
  <!-- minsim 따라다니는 이미지 -->
  <div id="minsim-float">
    <img src="minsim1.png" alt="minsim" />
  </div>

  <script>
    let lastScrollY = window.scrollY;
    const minsim = document.getElementById('minsim-float');

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      const delta = currentScrollY - lastScrollY;
      minsim.style.transform = `translateY(${Math.min(Math.max(delta, -10), 10)}px)`;
      lastScrollY = currentScrollY;
    });
  </script>
</body>
</html>
