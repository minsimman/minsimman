<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Linktree</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('background1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .overlay {
      min-height: 100vh;
      background: rgba(0,0,0,0.25);
      padding: 24px 16px 100px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 🔧 핵심 수정: auto-images를 레이아웃에서 제거 */
    #auto-images {
      display: contents;
    }

    .image-link {
      display: block;
      width: 74%;
      margin: 0 auto;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .img-0 {
      width: 95%;
      margin: 12px auto 8px;
      opacity: 0.95;
    }

    .image-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .image-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    .scroll-indicator {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-decoration: none;
      backdrop-filter: blur(6px);
      animation: float 1.6s ease-in-out infinite;
      z-index: 1000;
    }

    @keyframes float {
      0% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
      100% { transform: translate(-50%, 0); }
    }

    #minsim-float {
      position: fixed;
      right: 6px;
      bottom: 20px;
      z-index: 999;
      pointer-events: none;
    }

    #minsim-float img {
      width: 180px;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="container">

      <!-- image00 (고정) -->
      <div class="image-link img-0">
        <img src="image0000.png" alt="top image">
      </div>

      <!-- image01 (고정 + 링크) -->
      <a class="image-link"
         href="https://petitions.assembly.go.kr/proceed/onGoingAll/3F82B3E5292B6B8BE064ECE7A7064E8B"
         target="_blank">
        <img src="image01.png" alt="link image 01">
      </a>

      <!-- image2~20 자동 영역 -->
      <div id="auto-images"></div>

    </div>
  </div>

  <a href="#" class="scroll-indicator"
     onclick="window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' }); return false;">
    SCROLL
  </a>

  <div id="minsim-float">
    <img src="minsim1.png" alt="minsim">
  </div>

  <script>
    const autoContainer = document.getElementById('auto-images');

    const autoImages = [
      { file: 'image2.png', link: 'https://petitions.assembly.go.kr/proceed/onGoingAll/3F3C1D1219DC3B08E064B49691C6967B' },
      { file: 'image3.png', link: 'https://petitions.assembly.go.kr/proceed/onGoingAll/3F25B17CA1BA22CBE064ECE7A7064E8B' },
      { file: 'image4.png', link: 'https://petitions.assembly.go.kr/proceed/onGoingAll/3F795B247EE22AF1E064ECE7A7064E8B' },
      { file: 'image5.png', link: 'https://example.com/5' },
      { file: 'image6.png', link: 'https://example.com/6' },
      { file: 'image7.png', link: 'https://example.com/7' },
      { file: 'image8.png', link: 'https://example.com/8' },
      { file: 'image9.png', link: 'https://example.com/9' },
      { file: 'image10.png', link: 'https://example.com/10' },
      { file: 'image11.png', link: 'https://example.com/11' },
      { file: 'image12.png', link: 'https://example.com/12' },
      { file: 'image13.png', link: 'https://example.com/13' },
      { file: 'image14.png', link: 'https://example.com/14' },
      { file: 'image15.png', link: 'https://example.com/15' },
      { file: 'image16.png', link: 'https://example.com/16' },
      { file: 'image17.png', link: 'https://example.com/17' },
      { file: 'image18.png', link: 'https://example.com/18' },
      { file: 'image19.png', link: 'https://example.com/19' },
      { file: 'image20.png', link: 'https://example.com/20' }
    ];

    /* 순서 고정 로직 */

    // 1. 슬롯 먼저 생성
    const slots = autoImages.map(() => {
      const slot = document.createElement('div');
      slot.style.display = 'none';
      autoContainer.appendChild(slot);
      return slot;
    });

    // 2. 슬롯에 이미지 채우기
    autoImages.forEach((item, index) => {
      const img = new Image();
      img.src = item.file;

      img.onload = () => {
        const a = document.createElement('a');
        a.href = item.link;
        a.target = '_blank';
        a.className = 'image-link';
        a.appendChild(img);

        slots[index].appendChild(a);
        slots[index].style.display = 'block';
      };
      // 실패 시 slot은 비어 있음
    });

    // minsim 스크롤 반응
    let lastScrollY = window.scrollY;
    const minsim = document.getElementById('minsim-float');

    window.addEventListener('scroll', () => {
      const current = window.scrollY;
      const delta = current - lastScrollY;
      minsim.style.transform =
        `translateY(${Math.max(Math.min(delta, 10), -10)}px)`;
      lastScrollY = current;
    });
  </script>
</body>
</html>
